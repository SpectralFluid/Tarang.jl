name: Documentation

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
  repository_dispatch:
    types:
      - tagbot-release

concurrency:
  group: docs-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || github.ref }}

      - uses: julia-actions/setup-julia@v1
        with:
          version: '1.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev

      # Disable Julia cache to ensure fresh builds every time
      # - uses: julia-actions/cache@v1

      - name: Clean and install fresh
        run: |
          # Remove any cached/old files
          rm -rf docs/build
          rm -f docs/Manifest.toml

          # Clear Julia compiled cache for this package
          rm -rf ~/.julia/compiled/v1.10/Tarang* || true

          # Fresh install
          julia --project=docs/ -e '
            using Pkg
            # Remove old entry if exists
            try
              Pkg.rm("Tarang")
            catch e
              @info "No existing Tarang to remove"
            end
            # Develop from current directory
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()
            # Force recompilation
            Pkg.precompile()

            # Verify we have the right version
            using Tarang
            @info "Building docs with Tarang from: $(pathof(Tarang))"
          '

      - name: Build and deploy
        env:
          # Publish to this repository with the workflow token. The legacy
          # DOCUMENTER_KEY cannot push after the repository transfer.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs docs/make.jl

      # GITHUB_TOKEN pushes do not automatically trigger a branch-based Pages
      # build, so request publication explicitly after Documenter succeeds.
      - name: Publish GitHub Pages
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
